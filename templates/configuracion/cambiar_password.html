{% extends "base.html" %}
{% block title %}Cambiar contraseña — FitTrack{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <span class="tag-label">Seguridad</span>
                <h3 class="mb-4">Cambiar contraseña</h3>
                <form method="POST" action="{{ url_for('configuracion.cambiar_password') }}">
                    <div class="mb-3">
                        <label class="form-label">Contraseña actual</label>
                        <input type="password" class="form-control" name="password_actual" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Contraseña nueva</label>
                        <input type="password" class="form-control" name="password_nueva" required>
                        <p class="small mt-1 mb-0" style="color: var(--color-muted);">Mínimo 8 caracteres, con al menos una mayúscula, un número y un carácter especial (!@#$...).</p>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Actualizar contraseña</button>
                </form>
                <p class="mt-3 mb-0">
                    <a href="{{ url_for('configuracion.ver') }}">← Volver a configuración</a>
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
