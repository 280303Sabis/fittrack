{% extends "base.html" %}
{% block title %}Configuración — FitTrack{% endblock %}
{% block content %}

<span class="tag-label">Ajustes</span>
<h2 class="mb-4">Configuración</h2>

<div class="row g-3">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body p-4">
                <h5 class="mb-3">Meta semanal</h5>
                <form method="POST" action="{{ url_for('configuracion.ver') }}" id="formMeta">
                    <input type="hidden" name="unidad_medida" value="{{ current_user.unidad_medida }}">

                    <div class="mb-3">
                        <label class="form-label">Tipo de meta</label>
                        <select class="form-select" name="tipo_meta" id="tipoMeta">
                            <option value="minutos" {% if current_user.tipo_meta != 'dias' %}selected{% endif %}>Minutos de actividad</option>
                            <option value="dias" {% if current_user.tipo_meta == 'dias' %}selected{% endif %}>Días entrenados</option>
                        </select>
                    </div>

                    <div class="mb-4" id="campoMinutos" style="{% if current_user.tipo_meta == 'dias' %}display:none;{% endif %}">
                        <label class="form-label">Minutos de actividad por semana</label>
                        <input type="number" class="form-control" name="meta_minutos_semana"
                               value="{{ current_user.meta_minutos_semana }}" min="1">
                    </div>

                    <div class="mb-4" id="campoDias" style="{% if current_user.tipo_meta != 'dias' %}display:none;{% endif %}">
                        <label class="form-label">Días entrenados por semana</label>
                        <input type="number" class="form-control" name="meta_dias_semana"
                               value="{{ current_user.meta_dias_semana }}" min="1" max="7">
                    </div>

                    <button type="submit" class="btn btn-dark w-100">Guardar</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card mb-3">
            <div class="card-body p-4">
                <h5 class="mb-3">Unidades de medida</h5>
                <form method="POST" action="{{ url_for('configuracion.ver') }}">
                    <input type="hidden" name="meta_minutos_semana" value="{{ current_user.meta_minutos_semana }}">
                    <input type="hidden" name="meta_dias_semana" value="{{ current_user.meta_dias_semana }}">
                    <input type="hidden" name="tipo_meta" value="{{ current_user.tipo_meta }}">
                    <div class="mb-3">
                        <select class="form-select" name="unidad_medida">
                            <option value="metrico" {% if current_user.unidad_medida != 'imperial' %}selected{% endif %}>Métrico (kg, cm)</option>
                            <option value="imperial" {% if current_user.unidad_medida == 'imperial' %}selected{% endif %}>Imperial (lb, in)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Guardar</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <h5 class="mb-3">Tus datos</h5>
                <a href="{{ url_for('configuracion.exportar_datos') }}" class="btn btn-outline-dark w-100">Descargar mis datos (CSV)</a>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card mb-3">
            <div class="card-body p-4">
                <h5 class="mb-3">Seguridad</h5>
                <a href="{{ url_for('configuracion.cambiar_password') }}" class="btn btn-outline-dark w-100">Cambiar contraseña</a>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <h5 class="mb-3">Zona de riesgo</h5>
                <a href="{{ url_for('configuracion.eliminar_cuenta') }}" class="btn w-100" style="border: 1px solid var(--color-accent); color: var(--color-accent);">
                    Eliminar mi cuenta
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('tipoMeta').addEventListener('change', function () {
        const esDias = this.value === 'dias';
        document.getElementById('campoMinutos').style.display = esDias ? 'none' : 'block';
        document.getElementById('campoDias').style.display = esDias ? 'block' : 'none';
    });
</script>

{% endblock %}
