{% extends "base.html" %}
{% block title %}Mi perfil — FitTrack{% endblock %}
{% block content %}

<span class="tag-label">Tu cuenta</span>
<h2 class="mb-4">Mi perfil</h2>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4">
                <p class="small mb-4" style="color: var(--color-muted);">Correo: {{ current_user.email }}</p>

                <form method="POST" action="{{ url_for('perfil.ver') }}" enctype="multipart/form-data">
                    <div class="mb-4 text-center">
                        {% if current_user.foto %}
                            <img src="{{ url_for('static', filename='img/perfiles/' + current_user.foto) }}"
                                 alt="Foto de perfil" class="rounded-circle mb-2" style="width: 100px; height: 100px; object-fit: cover;">
                        {% else %}
                            <div class="rounded-circle mb-2 d-flex align-items-center justify-content-center mx-auto"
                                 style="width: 100px; height: 100px; background-color: var(--color-border); font-size: 2rem; color: var(--color-muted);">
                                {{ current_user.nombre[0]|upper }}
                            </div>
                        {% endif %}
                        <div>
                            <label class="form-label d-block">Foto de perfil</label>
                            <input type="file" class="form-control" name="foto" accept=".jpg,.jpeg,.png,.gif">
                            <p class="small mt-1 mb-0" style="color: var(--color-muted);">JPG, PNG o GIF, máximo 2 MB.</p>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" name="nombre" value="{{ current_user.nombre }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Peso ({{ 'lb' if current_user.unidad_medida == 'imperial' else 'kg' }})</label>
                            <input type="number" step="0.1" class="form-control" name="peso_kg" value="{{ peso_mostrar or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Altura ({{ 'in' if current_user.unidad_medida == 'imperial' else 'cm' }})</label>
                            <input type="number" step="0.1" class="form-control" name="altura_cm" value="{{ altura_mostrar or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Edad</label>
                            <input type="number" class="form-control" name="edad" value="{{ current_user.edad or '' }}">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Objetivo</label>
                        <select class="form-select" name="objetivo" required>
                            {% for valor, etiqueta in nombres_objetivo.items() %}
                                <option value="{{ valor }}" {% if current_user.objetivo == valor %}selected{% endif %}>{{ etiqueta }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <button type="submit" class="btn btn-dark w-100">Guardar cambios</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
