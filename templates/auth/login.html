{% extends "base.html" %}
{% block title %}Iniciar sesión — FitTrack{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <span class="tag-label">Bienvenido de nuevo</span>
                <h3 class="mb-4">Iniciar sesión</h3>
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Entrar</button>
                </form>
                <p class="mt-3 mb-1">
                    <a href="{{ url_for('auth.recuperar') }}">¿Olvidaste tu contraseña?</a>
                </p>
                <p class="mb-0">
                    ¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
