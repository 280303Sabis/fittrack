{% extends "base.html" %}
{% block title %}Recuperar contraseña — FitTrack{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <span class="tag-label">¿Olvidaste tu contraseña?</span>
                <h3 class="mb-1">Recuperar acceso</h3>
                <p class="small mb-4" style="color: var(--color-muted);">
                    Escribe tu correo y te enviaremos un link para restablecer tu contraseña.
                </p>
                <form method="POST" action="{{ url_for('auth.recuperar') }}">
                    <div class="mb-4">
                        <label class="form-label">Correo</label>
                        <input type="email" class="form-control" name="email" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Enviar link de recuperación</button>
                </form>
                <p class="mt-3 mb-0">
                    <a href="{{ url_for('auth.login') }}">← Volver a iniciar sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
