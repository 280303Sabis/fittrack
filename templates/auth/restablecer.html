{% extends "base.html" %}
{% block title %}Nueva contraseña — FitTrack{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <span class="tag-label">Último paso</span>
                <h3 class="mb-4">Elige tu nueva contraseña</h3>
                <form method="POST" action="{{ url_for('auth.restablecer', token=token) }}">
                    <div class="mb-4">
                        <label class="form-label">Nueva contraseña</label>
                        <input type="password" class="form-control" name="password" required autofocus>
                        <p class="small mt-1 mb-0" style="color: var(--color-muted);">Mínimo 8 caracteres, con al menos una mayúscula, un número y un carácter especial (!@#$...).</p>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Guardar nueva contraseña</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
